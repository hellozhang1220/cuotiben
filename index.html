<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="错题本" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>错题分析与管理系统</title>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title" id="topTitle">录入错题</div>
  </header>

  <main id="main">
    <!-- 录入 -->
    <section class="view active" id="view-input">
      <div class="card">
        <label class="field">
          <span class="field-label">科目</span>
          <select id="in-subject"></select>
        </label>
        <label class="field">
          <span class="field-label">年级</span>
          <select id="in-grade"></select>
        </label>
        <div class="field-row">
          <label class="field">
            <span class="field-label">来源</span>
            <select id="in-source"></select>
          </label>
          <label class="field">
            <span class="field-label">题型</span>
            <select id="in-type"></select>
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span class="field-label">错因</span>
            <select id="in-reason"></select>
          </label>
          <label class="field">
            <span class="field-label">难度</span>
            <select id="in-diff"></select>
          </label>
        </div>
        <label class="field">
          <span class="field-label">知识点</span>
          <input id="in-kp" list="kp-list" placeholder="如：一元一次方程" autocomplete="off" />
          <datalist id="kp-list"></datalist>
        </label>

        <div class="section-title">📝 题目（以图片为主）</div>
        <!-- 题目图片 + 自动识别题目文字 -->
        <div class="field-label">题目图片（拍照 / 相册，可多张）</div>
        <div class="photo-bar">
          <label class="photo-btn">
            📷 拍照/选图
            <input id="in-photos" type="file" accept="image/*" capture="environment" multiple hidden />
          </label>
          <button class="ocr-btn" id="btn-ocr-question" type="button">🤖 识别题目文字（可选）</button>
        </div>
        <div class="photo-hint">提示：图片若同时含题目和答案，会自动只提取题目；原图可在详情里点开查看。</div>
        <div class="thumbs" id="in-thumbs"></div>
        <!-- 识别出的题目文字（只读预览，可清除） -->
        <div class="qtext-preview" id="qtext-preview" hidden>
          <div class="qtext-head">
            <span>已识别题目文字（自动附带，点 × 可清除）</span>
            <button type="button" id="qtext-clear" class="qtext-clear">×</button>
          </div>
          <div class="qtext-body" id="qtext-text"></div>
        </div>

        <div class="section-title">✏️ 作答情况</div>
        <!-- 我的错答：支持图片 -->
        <label class="field">
          <span class="field-label">我的错答<span class="req">*</span></span>
          <textarea id="in-wrong" rows="2" placeholder="当时怎么答的（可上传图片）"></textarea>
        </label>
        <div class="photo-bar">
          <label class="photo-btn">
            📷 上传错答图片
            <input id="in-wrong-photos" type="file" accept="image/*" capture="environment" multiple hidden />
          </label>
          <button class="ocr-btn" id="btn-ocr-wrong" type="button">🤖 识别文字</button>
        </div>
        <div class="thumbs" id="in-wrong-thumbs"></div>

        <!-- 正确答案：支持图片 + 识别 -->
        <label class="field">
          <span class="field-label">正确答案<span class="req">*</span></span>
          <textarea id="in-correct" rows="2" placeholder="正确答案（可上传图片并识别）"></textarea>
        </label>
        <div class="photo-bar">
          <label class="photo-btn">
            📷 上传答案图片
            <input id="in-correct-photos" type="file" accept="image/*" capture="environment" multiple hidden />
          </label>
          <button class="ocr-btn" id="btn-ocr-correct" type="button">🤖 识别答案文字</button>
        </div>
        <div class="thumbs" id="in-correct-thumbs"></div>

        <div class="section-title">🧠 解析与巩固</div>
        <label class="field">
          <div class="field-label-row">
            <span class="field-label">解题思路 / 解析<span class="req">*</span></span>
            <button class="mic-btn" id="btn-solution-voice" type="button">🎤 语音输入</button>
          </div>
          <textarea id="in-solution" rows="3" placeholder="正确思路、易错提醒（可点🎤语音输入）"></textarea>
        </label>

        <button class="btn-primary" id="btn-save">保存错题</button>
        <div class="save-tip" id="saveTip"></div>
      </div>
    </section>

    <!-- 错题本 -->
    <section class="view" id="view-list">
      <div class="stat-cards mini" id="list-stat"></div>
      <div class="filters">
        <select id="f-subject"></select>
        <select id="f-grade"></select>
        <select id="f-status"></select>
      </div>
      <div class="list" id="list-container"></div>
    </section>

    <!-- 分析 -->
    <section class="view" id="view-analysis">
      <div class="stat-cards" id="stat-cards"></div>
      <div class="chart-block" id="chart-subject"></div>
      <div class="chart-block" id="chart-grade"></div>
      <div class="chart-block" id="chart-type"></div>
      <div class="chart-block" id="chart-reason"></div>
      <div class="chart-block" id="chart-kp"></div>
    </section>

    <!-- 复习 -->
    <section class="view" id="view-review">
      <div class="review-head" id="review-head"></div>
      <div class="list" id="review-container"></div>
    </section>

    <!-- 我的 -->
    <section class="view" id="view-me">
      <div class="card">
        <label class="field">
          <span class="field-label">当前年级（录入默认 & 可切换）</span>
          <select id="me-grade"></select>
        </label>
        <p class="me-tip">切换年级后，历史错题会按原年级保留，互不干扰。</p>
        <button class="btn-outline" id="btn-export">导出备份（JSON + 图片）</button>
        <button class="btn-outline" id="btn-import">导入备份</button>
        <input id="import-file" type="file" accept="application/json" hidden />
        <button class="btn-danger" id="btn-clear">清空全部数据</button>
        <p class="me-tip">数据默认存在本机（iPad）。导出备份可存到 iCloud / 文件 App 防丢。</p>
      </div>

      <div class="card">
        <h3 class="card-title">图片识别设置（OCR）</h3>
        <label class="field">
          <span class="field-label">识别方式</span>
          <select id="ocr-provider">
            <option value="auto">自动（有 Key 用云端 AI，否则本地）</option>
            <option value="cloud">仅云端 AI 视觉（最准）</option>
            <option value="local">仅本地（离线，准确度一般）</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">API 地址（云端）</span>
          <input id="ocr-endpoint" placeholder="https://api.openai.com/v1" autocomplete="off" />
        </label>
        <label class="field">
          <span class="field-label">API Key（仅存本机，不上传第三方）</span>
          <input id="ocr-key" type="password" placeholder="sk-... / 通义 / 智谱 / DeepSeek 等" autocomplete="off" />
        </label>
        <label class="field">
          <span class="field-label">模型</span>
          <input id="ocr-model" placeholder="gpt-4o-mini（按服务商填写）" autocomplete="off" />
        </label>
        <button class="btn-outline" id="btn-ocr-save" type="button">保存识别设置</button>
        <button class="btn-outline" id="btn-ocr-test" type="button">测试识别（选一张图）</button>
        <input id="ocr-test-input" type="file" accept="image/*" hidden />
        <p class="me-tip">云端方式会把图片传给对应服务商做识别以换取高准确度；Key 只存在你 iPad 本地。不填 Key 则使用本地识别（离线、免费、但中文+公式一般）。</p>
      </div>
    </section>
  </main>

  <!-- 详情弹层 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card" id="modal-card"></div>
  </div>

  <!-- 复习作答弹层 -->
  <div class="modal" id="review-modal" hidden>
    <div class="modal-card" id="review-modal-card"></div>
  </div>

  <!-- 图片放大 -->
  <div class="lightbox" id="lightbox" hidden>
    <img id="lightbox-img" src="" alt="放大查看" />
  </div>

  <!-- 识别进度提示 -->
  <div class="toast" id="toast" hidden></div>

  <!-- 复习拍照（隐藏） -->
  <input id="rv-cam-input" type="file" accept="image/*" capture="environment" hidden />

  <!-- 保存成功弹窗 -->
  <div class="modal" id="success-modal" hidden>
    <div class="modal-card success-card">
      <div class="success-emoji">🎉</div>
      <h3 id="success-title">保存成功</h3>
      <p id="success-msg"></p>
      <button class="btn-primary" id="success-ok" type="button">好的</button>
    </div>
  </div>

  <!-- 通用确认弹窗（删除/清空/导入） -->
  <div class="modal" id="confirm-modal" hidden>
    <div class="modal-card confirm-card">
      <button class="close-x">×</button>
      <h3 id="confirm-title">请确认</h3>
      <p id="confirm-msg"></p>
      <div class="btn-group">
        <button class="btn-outline" id="confirm-cancel" type="button">取消</button>
        <button class="btn-danger-solid" id="confirm-ok" type="button">确定</button>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <button class="tab active" data-view="input"><span>➕</span>录入</button>
    <button class="tab" data-view="list"><span>📚</span>错题本</button>
    <button class="tab" data-view="analysis"><span>📊</span>分析</button>
    <button class="tab" data-view="review"><span>🔁</span>复习</button>
    <button class="tab" data-view="me"><span>👤</span>我的</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
