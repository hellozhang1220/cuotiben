<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 深蓝圆角底（iOS 自动裁圆角，这里保留圆角观感更统一） -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="#1E3A8A"/>
  <!-- 柔光装饰 -->
  <circle cx="180" cy="180" r="120" fill="#FFFFFF" opacity="0.10"/>
  <circle cx="860" cy="860" r="150" fill="#FFFFFF" opacity="0.08"/>
  <!-- 白色「错」字 + 红色描边 -->
  <text x="512" y="540" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif"
        font-size="700" font-weight="700" fill="#FFFFFF" stroke="#FF3B30" stroke-width="18"
        stroke-linejoin="round" text-anchor="middle" dominant-baseline="central">错</text>
</svg>
